<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AI Job Hunter{% endblock %}</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2330; --text:#e8eef5; --muted:#8aa0b5; --accent:#3d9cf0; --ok:#3ecf8e; --warn:#f0b429; }
    body { font-family: Segoe UI, system-ui, sans-serif; margin:0; background:var(--bg); color:var(--text); }
    header { display:flex; gap:1.5rem; align-items:center; padding:1rem 1.5rem; background:#121a24; border-bottom:1px solid #243044; }
    header a { color:var(--accent); text-decoration:none; }
    main { padding:1.5rem; max-width:1200px; margin:0 auto; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; }
    .card { background:var(--card); padding:1rem; border-radius:8px; }
    .card h3 { margin:0 0 .4rem; font-size:.9rem; color:var(--muted); font-weight:600; }
    .card p { margin:0; font-size:1.6rem; }
    table { width:100%; border-collapse:collapse; background:var(--card); }
    th, td { text-align:left; padding:.6rem .75rem; border-bottom:1px solid #243044; font-size:.92rem; }
    th { color:var(--muted); font-weight:600; }
    a.btn, button, input[type=submit] { background:var(--accent); color:#061018; border:0; padding:.45rem .8rem; border-radius:6px; cursor:pointer; text-decoration:none; font-weight:600; }
    .row-actions { display:flex; gap:.4rem; flex-wrap:wrap; align-items:flex-start; }
    main a { color:var(--accent); }
    .muted { color:var(--muted); }
    form.inline { display:inline; }
    select, input[type=text], input[type=url], input[type=search], input[type=number], textarea { background:#0f1419; color:var(--text); border:1px solid #314155; padding:.35rem; border-radius:4px; }
    .job-filters { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1.5rem; align-items:center; }
    .table-scroll { overflow-x:auto; }
    .sort-column { background:transparent; color:var(--muted); padding:0; }
    [hidden] { display:none !important; }
    pre { white-space:pre-wrap; background:#0c1117; padding:1rem; border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <strong>AI Job Hunter</strong>
    <a href="/">Overview</a>
    <a href="/jobs">Jobs</a>
    <a href="/applications">Applications</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
