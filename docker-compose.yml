services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://jobhunter:jobhunter@db:5432/jobhunter
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_LEVEL: INFO
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
